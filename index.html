  <style>
    /* ==== THEMES ==== */
    :root, [data-theme="day"] {
      --bg: #f4f1ea; --panel: #fffdf8; --panel-2: #efe9dd; --ink: #1d232b; --muted: #5d6570; --line: #ddd4c3;
      --accent: #c2410c; --accent-ink: #ffffff; --accent-soft: #fbe3d5; --good: #2f7d4f; --good-soft: #dcefe2;
      --bad: #b42318; --bad-soft: #f8dcd8; --warn: #9a6200; --focus: #1d4ed8; --coffee: #ffdd00; --coffee-ink: #1d1a12;
      --term-bg: #1a1e24; --term-ink: #d8dee6; --term-dim: #8b95a1; --term-line: #2b323b;
      --hash: #f0b45a; --add: #8fd19e; --del: #f39a90; --hunk: #82c0da; --deco: #c7a6f0; --note: #a9b4c0;
      --shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 20px -12px rgba(60,40,10,.25);
      --lane-0: #c2410c; --lane-1: #2563eb; --lane-2: #7c3aed; --lane-3: #0f766e; --lane-4: #a16207; --lane-5: #be185d;
    }
    [data-theme="night"] {
      --bg: #0d1015; --panel: #141920; --panel-2: #1a2029; --ink: #e7e2d7; --muted: #9ba4ae; --line: #29313c;
      --accent: #ff9e4a; --accent-ink: #1b1005; --accent-soft: #3a2513; --good: #5cc98d; --good-soft: #15301f;
      --bad: #ff6f61; --bad-soft: #3a1714; --warn: #f2c14e; --focus: #7aa2ff; --coffee: #ffdd00; --coffee-ink: #1d1a12;
      --term-bg: #090c10; --term-ink: #d8dee6; --term-dim: #7f8995; --term-line: #1e252e;
      --shadow: 0 1px 0 rgba(255,255,255,.02), 0 10px 24px -14px rgba(0,0,0,.8);
      --lane-0: #ff9e4a; --lane-1: #6ea8ff; --lane-2: #b794f6; --lane-3: #4fd1c5; --lane-4: #f2c14e; --lane-5: #f472b6;
    }
    [data-theme="contrast"] {
      --bg: #000; --panel: #000; --panel-2: #111; --ink: #fff; --muted: #e6e6e6; --line: #fff;
      --accent: #ffd400; --accent-ink: #000; --accent-soft: #332b00; --good: #3dff8a; --good-soft: #002b12;
      --bad: #ff6b6b; --bad-soft: #330000; --warn: #ffd400; --focus: #00e5ff; --coffee: #ffd400; --coffee-ink: #000;
      --term-bg: #000; --term-ink: #fff; --term-dim: #d0d0d0; --term-line: #fff;
      --hash: #ffd400; --add: #3dff8a; --del: #ff8a8a; --hunk: #00e5ff; --deco: #ff9cff; --note: #ffffff;
      --shadow: none;
      --lane-0: #ffd400; --lane-1: #00e5ff; --lane-2: #ff9cff; --lane-3: #3dff8a; --lane-4: #ffffff; --lane-5: #ff8a8a;
    }

    /* ==== BASE ==== */
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--ink); font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    code, kbd, .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    code { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: .9em; }
    kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: .78em; background: var(--panel); }
    a { color: var(--accent); }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .wrap { max-width: 1440px; margin: 0 auto; padding: 0 16px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ==== HEADER ==== */
    header.top { border-bottom: 1px solid var(--line); background: var(--panel); }
    header.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 60px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; font-size: 18px; text-decoration: none; color: var(--ink); }
    .logo small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
    .progress { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 13px; color: var(--muted); }
    .bar { width: 120px; height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
    .bar > i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
    .tools { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 11px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); line-height: 1.3; }
    .btn:hover { border-color: var(--muted); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
    .btn.primary:hover { filter: brightness(1.06); }
    .btn.ghost { background: transparent; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.danger { color: var(--bad); }
    .coffee-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--coffee); color: var(--coffee-ink); border: 1px solid rgba(0,0,0,.12); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; line-height: 1.3; transition: transform .18s, box-shadow .18s; }
    .coffee-btn:hover { transform: translateY(-1px) rotate(-1deg); box-shadow: 0 4px 12px -4px rgba(0,0,0,.35); }
    .coffee-btn .cup { display: inline-block; transition: transform .3s; }
    .coffee-btn:hover .cup { transform: rotate(-14deg) scale(1.15); }
    .support { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-color: var(--coffee); }
    .support p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    @media (max-width: 560px) { .coffee-btn .lbl-long { display: none; } }

    /* ==== CASE STRIP ==== */
    .strip { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0; scrollbar-width: thin; }
    .chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 10px; text-align: left; min-width: 92px; }
    .chip b { display: block; font-family: "IBM Plex Mono", monospace; font-size: 13px; }
    .chip span { font-size: 11px; color: var(--muted); }
    .chip.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .chip.done b::after { content: " ✓"; color: var(--good); }
    .chip:disabled { opacity: .5; cursor: not-allowed; }

    /* ==== LAYOUT ==== */
    main.grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; padding-bottom: 24px; }
    @media (max-width: 980px) { main.grid { grid-template-columns: minmax(0, 1fr); } }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
    .card + .card { margin-top: 16px; }
    .pad { padding: 18px 20px; }
    @media (max-width: 560px) { .pad { padding: 14px; } }
    .eyebrow { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    h1.case-title { margin: 4px 0 6px; font-size: 26px; line-height: 1.15; letter-spacing: -.015em; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .tag { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 1px 9px; background: var(--panel-2); }
    .tag.accent { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
    .briefing { margin: 0 0 14px; }
    .mentor { border-left: 3px solid var(--accent); background: var(--panel-2); border-radius: 0 10px 10px 0; padding: 10px 14px; margin: 0 0 16px; font-size: 14px; }
    .mentor b { display: block; font-size: 12px; }
    .mentor b span { color: var(--muted); font-weight: 500; }
    h3.sec { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 18px 0 8px; }
    ul.obj { margin: 0; padding: 0; list-style: none; }
    ul.obj li { position: relative; padding: 3px 0 3px 22px; font-size: 14px; }
    ul.obj li::before { content: "▸"; position: absolute; left: 4px; color: var(--accent); }
    .evidence-line { font-size: 13px; background: var(--panel-2); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
    .cheats { display: flex; flex-wrap: wrap; gap: 6px; }
    .cheat { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 8px; text-align: left; font-size: 12px; max-width: 100%; }
    .cheat code { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; word-break: break-all; }
    .cheat span { color: var(--muted); margin-left: 6px; }
    .cheat:hover { border-color: var(--accent); }
    .intel { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 14px; }
    .intel-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .hint { margin-top: 10px; background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    .declass { margin-top: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
    .declass pre { margin: 6px 0; white-space: pre-wrap; word-break: break-all; }

    /* ==== TERMINAL ==== */
    .term { background: var(--term-bg); color: var(--term-ink); border-radius: 14px; border: 1px solid var(--term-line); overflow: hidden; }
    .term-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--term-line); font-size: 12px; color: var(--term-dim); }
    .dots { display: flex; gap: 5px; }
    .dots i { width: 10px; height: 10px; border-radius: 50%; background: #3a424d; display: block; }
    .dots i:nth-child(1) { background: #e5534b; } .dots i:nth-child(2) { background: #d4a72c; } .dots i:nth-child(3) { background: #57ab5a; }
    .term-head .grow { flex: 1; }
    .timer { font-family: "IBM Plex Mono", monospace; color: var(--term-ink); }
    .timer.over { color: var(--del); }
    .term-body { height: 430px; overflow: auto; padding: 10px 14px 4px; font: 13px/1.5 "IBM Plex Mono", monospace; white-space: pre-wrap; word-break: break-word; overscroll-behavior: contain; }
    @media (max-width: 560px) { .term-body { height: 360px; font-size: 12px; padding: 8px 10px 4px; } }
    .tl { min-height: 1.5em; }
    .tl.cmd { color: #fff; margin-top: 6px; }
    .tl.cmd .ps { color: var(--add); }
    .tl.cmd .ps b { color: var(--hunk); font-weight: 500; }
    .c-commit, .c-hash { color: var(--hash); }
    .c-hash { cursor: pointer; border-radius: 3px; }
    .c-hash:hover { background: rgba(240,180,90,.18); text-decoration: underline; }
    .c-deco { color: var(--deco); }
    .c-add { color: var(--add); } .c-del { color: var(--del); } .c-hunk { color: var(--hunk); }
    .c-file { color: #fff; font-weight: 600; }
    .c-err { color: var(--del); }
    .c-note { color: var(--note); font-style: italic; }
    .c-culprit { color: #fff; background: rgba(229,83,75,.35); font-weight: 600; }
    .c-bisect { color: var(--hunk); }
    .c-sys { color: var(--term-dim); }
    .term-input { display: flex; align-items: center; gap: 8px; padding: 8px 14px 10px; border-top: 1px solid var(--term-line); font: 13px "IBM Plex Mono", monospace; }
    .term-input label { color: var(--add); white-space: nowrap; }
    .term-input label b { color: var(--hunk); font-weight: 500; }
    .term-input input { flex: 1; min-width: 0; background: transparent; border: 0; color: #fff; font: inherit; outline: none; caret-color: var(--hash); padding: 4px 0; }
    .term-actions { display: flex; gap: 8px; padding: 0 14px 12px; flex-wrap: wrap; align-items: center; }
    .term-actions .btn { background: #222932; color: var(--term-ink); border-color: #38414c; }
    [data-theme="contrast"] .term-actions .btn { background: #000; border-color: #fff; }
    .term-actions .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .term-actions .keys { color: var(--term-dim); font-size: 11px; margin-left: auto; }
    .term-actions .keys kbd { background: #222932; color: var(--term-ink); border-color: #38414c; }
    @media (max-width: 560px) { .term-actions .keys { display: none; } .term-input label { max-width: 40%; overflow: hidden; text-overflow: ellipsis; } }
    .completions { padding: 0 14px 6px; color: var(--term-dim); font: 12px "IBM Plex Mono", monospace; }
    .shake { animation: shake .4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

    /* ==== EVIDENCE PANEL ==== */
    .ev { padding: 14px 18px; }
    .ev-status { font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .ev-status.good { color: var(--good); } .ev-status.bad { color: var(--bad); } .ev-status.neutral { color: var(--ink); }
    .ev ul { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; }
    .ev li { padding: 2px 0; }
    .ev .check { display: flex; gap: 8px; align-items: baseline; }
    .ev .check .mark { width: 18px; flex: 0 0 18px; text-align: center; font-weight: 700; }
    .ev .check.ok .mark { color: var(--good); } .ev .check.no .mark { color: var(--muted); }
    .ev .note { color: var(--muted); font-size: 12px; }
    .ev .mono { font-size: 12.5px; }
    .log { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; font: 12px/1.5 "IBM Plex Mono", monospace; color: var(--muted); max-height: 120px; overflow: auto; }
    .log div.bad { color: var(--bad); } .log div.good { color: var(--good); }

    /* ==== GRAPH ==== */
    .graph-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px 6px; flex-wrap: wrap; }
    .graph-head h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
    .legend { display: flex; gap: 10px; font-size: 11px; color: var(--muted); flex-wrap: wrap; margin-left: auto; }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
    .graph { position: relative; max-height: 420px; overflow: auto; padding: 0 0 10px; }
    .graph svg { position: absolute; left: 0; top: 0; pointer-events: none; }
    .grow-row { display: flex; align-items: center; gap: 8px; height: 28px; padding-right: 14px; font-size: 13px; cursor: pointer; white-space: nowrap; border-radius: 6px; }
    .grow-row:hover { background: var(--panel-2); }
    .grow-row.listed { background: var(--accent-soft); }
    .grow-row.out { opacity: .45; }
    .grow-row .h { font-family: "IBM Plex Mono", monospace; color: var(--accent); font-size: 12.5px; }
    .grow-row .s { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 60px; }
    .grow-row .a { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; max-width: 30%; }
    @media (max-width: 560px) { .grow-row .a { display: none; } }
    .ref { font: 11px/1.4 "IBM Plex Mono", monospace; border-radius: 5px; padding: 0 5px; border: 1px solid var(--line); background: var(--panel-2); white-space: nowrap; }
    .ref.head { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .ref.tag { border-style: dashed; }
    .mk { font: 10.5px/1.4 "IBM Plex Mono", monospace; border-radius: 5px; padding: 0 5px; font-weight: 600; }
    .mk.good { background: var(--good-soft); color: var(--good); }
    .mk.bad, .mk.culprit { background: var(--bad-soft); color: var(--bad); }
    .mk.skip { background: var(--panel-2); color: var(--muted); }
    .mk.pick { background: var(--panel-2); color: var(--muted); }

    /* ==== BADGES / FOOTER ==== */
    .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .badge { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--panel); }
    .badge.off { opacity: .45; filter: grayscale(1); }
    .badge .i { font-size: 20px; }
    .badge b { display: block; font-size: 13px; }
    .badge span { font-size: 12px; color: var(--muted); }
    footer { border-top: 1px solid var(--line); margin-top: 24px; padding: 18px 0 30px; color: var(--muted); font-size: 13px; }
    footer .wrap { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .final-card { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }

    /* ==== MODALS ==== */
    .backdrop { position: fixed; inset: 0; background: rgba(10,12,16,.55); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; overflow: auto; z-index: 50; }
    .modal { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; max-width: 720px; width: 100%; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); position: relative; }
    .modal .x { position: absolute; top: 10px; right: 10px; }
    .stamp { display: inline-block; border: 3px solid var(--bad); color: var(--bad); font-weight: 800; letter-spacing: .14em; padding: 4px 12px; transform: rotate(-4deg); border-radius: 6px; font-size: 18px; animation: stamp .45s cubic-bezier(.2,1.6,.5,1); }
    @keyframes stamp { from { transform: rotate(-4deg) scale(2.2); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: 1; } }
    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
    @media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
    .tile { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
    .tile b { display: block; font-size: 20px; font-family: "IBM Plex Mono", monospace; }
    .tile span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    table.breakdown { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.breakdown td { padding: 3px 0; border-bottom: 1px dashed var(--line); }
    table.breakdown td:last-child { text-align: right; font-family: "IBM Plex Mono", monospace; }
    .explain { margin: 0; padding: 0; list-style: none; font-size: 13px; }
    .explain li { display: grid; grid-template-columns: minmax(90px, 38%) 1fr; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--line); }
    .explain code { word-break: break-all; }

function testRun(checks) {
  const fails = checks.filter((c) => !c[1]);

  for (const [name, ok, why] of checks) lines.push(ok ? `  ✔ ${name}` : `  ✖ ${name}${why ? ' — ' + why : ''}`);

  return { code: fails.length ? 1 : 0, out: lines.join('\n') };
}
function importsOk(tree, file) {
  const src = tree[file] || '';
  const dir = file.replace(/[^/]+$/, '');
  for (const m of src.matchAll(/from '\.\/([^']+)'/g)) {
    if (tree[dir + m[1]] === undefined) return `Cannot find module '${dir + m[1]}' imported from ${file}`;
  }
  return null;
}

          const twice = (t['src/pricing.js'] || '').includes('fx.convert(') && (t['src/checkout.js'] || '').includes('fx.convert(');
          return testRun([
            ['checkout: USD order total', true],
            ['checkout: EUR order converted exactly once', !twice, 'expected 1116, got 1038'],
            ['receipts: currency code shown', true],
          ]);
        },
        './scripts/bisect-check.sh': (t, ctx) => {
          const e = importsOk(t, 'src/checkout.js') || importsOk(t, 'src/pricing.js');
          if (e) return { code: 125, out: buildFail(e).out + '\n(bisect-check: build failed → exit 125, skip this commit)' };
          const r = CASES[9].repo.scripts['npm test'](t, ctx);
          return { code: r.code, out: BUILD_OK.out + '\n' + r.out };
        },
      },
    },
    startInput: 'git status',
    grade: { kind: 'state', size: 'moves', check: (g) => {
      const tip = g.tip('release/2.6');
      const chain = tip ? g.firstParents(tip, 12) : [];
      const added = [];
      for (const id of chain) { if (id === 'm15') break; added.push(id); }
      const reachedBase = chain.includes('m15');
      const test = tip ? g.run('npm test', tip) : { code: 1 };
      return [
        { label: 'Bisect named the culprit on release/2.6', ok: g.bisectResult() === 'm11', note: g.bisectResult() ? `Your last bisect named ${g.short(g.bisectResult())} “${g.subject(g.bisectResult())}”.` : 'No bisect session has finished with a single culprit yet.' },
        { label: 'release/2.6 has exactly one new commit: Mira’s working fix', ok: reachedBase && added.length === 1 && g.origin(added[0]) === 'n2', note: reachedBase ? (added.length ? `New on release/2.6: ${added.slice().reverse().map((id) => '“' + g.subject(id) + '”').join(', ')}` : 'release/2.6 has no new commits yet.') : 'release/2.6 no longer builds on “Release 2.6.0”.' },
        { label: 'npm test passes on release/2.6', ok: test.code === 0 },
      ];
    } },
    solution: { steps: ['git bisect start release/2.6 v2.6.0-rc1', 'git bisect run ./scripts/bisect-check.sh', 'git bisect reset', 'git reflog', 'git switch release/2.6', 'git cherry-pick {{n2}}'], note: 'git show <hash> on both of Mira’s reflog commits shows which one changes the double conversion. Only “convert once, at the pricing boundary” does.' },
    hints: [
      'Three moves: (1) git bisect start release/2.6 v2.6.0-rc1 + git bisect run ./scripts/bisect-check.sh. (2) git bisect reset, then git reflog and look for Mira’s commits on mira/… branches. (3) Switch to release/2.6 and cherry-pick.',
      'Mira’s first attempt only refreshes rates. The fix you want is “convert once, at the pricing boundary”. Cherry-pick that hash while on release/2.6, not while bisect has HEAD detached.',
    ],
    nudges: [],
    conceptUnlocked: 'Real incidents chain the tools: bisect for “when”, log/blame for “who and why”, reflog for “where did it go”, cherry-pick for “ship only this”.',
    debrief: 'Kit’s “perf” commit converted every item price, and checkout converted the total again. Mira’s second attempt removes the second conversion. It’s on release/2.6, tests are green, and the status page says resolved. Postmortem at 10:00: blameless, but with excellent evidence.',
    cheats: [
      ['git bisect start release/2.6 v2.6.0-rc1', 'bad, then good'],
      ['git bisect run ./scripts/bisect-check.sh', 'auto, with skips'],
      ['git bisect reset', 'leave bisect'],
      ['git reflog', 'find deleted work'],
      ['git switch release/2.6', 'target branch'],
      ['git cherry-pick ', 'ship one commit'],
      ['npm test', 'verify'],
    ],
  },
];

const BADGES = [
  { id: 'first', icon: '🔎', name: 'First Contact', desc: 'Close your first case.', test: (p) => Object.keys(p.solved).length >= 1 },
  { id: 'clean', icon: '🧤', name: 'Clean Hands', desc: 'Close a case without hints or declassified answers.', test: (p) => Object.values(p.solved).some((s) => !s.hintsUsed && !s.revealed) },
  { id: 'lean', icon: '✂️', name: 'Lean Command', desc: 'Earn the efficiency bonus on any case.', test: (p) => Object.values(p.solved).some((s) => s.efficient) },
  { id: 'flawless', icon: '🎯', name: 'Flawless', desc: 'Close a case with zero misfires.', test: (p) => Object.values(p.solved).some((s) => !s.failed) },
  { id: 'oncall', icon: '📟', name: 'On Call', desc: 'Close 5 cases.', test: (p) => Object.keys(p.solved).length >= 5 },
  { id: 'pager', icon: '⏱️', name: 'Beat the Pager', desc: 'Solve the capstone under par time.', test: (p) => !!(p.solved['case-10'] && p.solved['case-10'].underPar) },
  { id: 'principal', icon: '🏅', name: 'Principal Investigator', desc: 'Close all 10 cases.', test: (p) => CASES.every((c) => p.solved[c.id]) },

  </script>

  <script type="text/babel" data-presets="react">
  const { useState, useEffect, useRef, useMemo, useCallback } = React;

  /* ==== CONFIG ==== */
  const STORAGE_KEY = 'whoBrokeProd.v1';
  const SUPPORT_URL = 'https://buymeacoffee.com/marginnotes'; // Buy Me a Coffee page. Empty string hides every coffee button
  const MAX_LINES = 800;
  const MAX_HISTORY = 300;
  const SCORE = { BASE: 1000, MISFIRE: 100, HINT: 200, REVEAL: 500, EFFICIENCY: 150, PAR_FIXED: 100, PAR_SCALED: 500, FLOOR: 100 };
  const THEMES = ['day', 'night', 'contrast'];
  const THEME_LABEL = { day: '☀ Day shift', night: '☾ Night shift', contrast: '◐ High contrast' };

  /* ==== PERSISTENCE ==== */
  const DEFAULTS = () => ({ v: 1, solved: {}, sessions: {}, drafts: {}, current: 0, settings: { sound: true, theme: null }, completedAt: null });
  function loadProgress() {
    const d = DEFAULTS();
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (!raw || raw.v !== 1) return d;
      const p = { ...d, ...raw, settings: { ...d.settings, ...(raw.settings || {}) } };
      if (p.settings.theme && !THEMES.includes(p.settings.theme)) p.settings.theme = null;
      if (!(p.current >= 0 && p.current < CASES.length)) p.current = 0;
      return p;
    } catch (e) { return d; }
  }
  function saveProgress(p) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) { /* storage blocked: play on */ } }
  const solvedCount = (p) => CASES.filter((c) => p.solved[c.id]).length;
  const isUnlocked = (p, i) => i === 0 || !!p.solved[CASES[i - 1].id] || !!p.solved[CASES[i].id];

  /* ==== SOUND ==== */
  let audioCtx = null;
  function beep(kind, on) {
    if (!on) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const seqs = { run: [[660, .04]], ok: [[520, .07], [780, .1]], fail: [[220, .12], [160, .18]], win: [[523, .1], [659, .1], [784, .1], [1047, .22]], error: [[180, .08]] };
      let t = audioCtx.currentTime;
      for (const [f, d] of seqs[kind] || []) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = kind === 'fail' || kind === 'error' ? 'sawtooth' : 'triangle';
        o.frequency.value = f; g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
        o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + d + .02); t += d * .9;
      }
    } catch (e) { /* no audio */ }
  }

  /* ==== SANDBOX HELPERS ==== */
  const hashify = (st, s) => (s || '').replace(/\{\{(\w+)\}\}/g, (_, id) => (st.commits[id] ? st.commits[id].hash.slice(0, 7) : id));
  const refCache = {};
  function reference(c) {
    if (refCache[c.id]) return refCache[c.id];
    const st = GitSim.build(c.repo);
    let lines, size;
    if (c.grade.kind === 'output') { lines = [c.solution.cmd]; size = GitSim.tokenCount(c.solution.cmd); }
    else {
      lines = c.solution.steps.map((s) => hashify(st, s));
      for (const l of lines) GitSim.exec(st, l);
      size = c.grade.size === 'steps' ? st.bisectResultSteps : GitSim.api(st).moves().length;
    }
    return (refCache[c.id] = { lines, size, note: c.solution.note ? hashify(st, c.solution.note) : '' });
  }
  function diffItems(expected, actual) {
    const pool = [...expected];
    let hits = 0;
    const extras = [];
    for (const a of actual) { const i = pool.indexOf(a); if (i >= 0) { pool.splice(i, 1); hits++; } else extras.push(a); }
    return { exact: expected.length === actual.length && expected.every((e, i) => e === actual[i]), hits, missing: pool, extras };
  }
  function itemLabel(st, kind, it) {
    if (kind === 'blame') {
      const [ln, id] = it.split(':');
      const c = st.commits[id];
      return c ? `line ${ln} → ${c.hash.slice(0, 7)} (${c.author.replace(/\s*<.*$/, '')})` : it;
    }
    const c = st.commits[it];
    return c ? `${c.hash.slice(0, 7)} ${c.msg.split('\n')[0]}` : it;
  }
  function stateSize(c, st) {
    return c.grade.size === 'steps' ? st.bisectResultSteps : GitSim.api(st).moves().length;
  }

  /* ==== SCORING (pure) ==== */
  function computeScore({ failed, hintsUsed, revealed }, efficient, elapsed, timeLimit) {
    const rows = [['Base', SCORE.BASE]];
    if (failed) rows.push([`Misfires × ${failed}`, -SCORE.MISFIRE * failed]);
    if (hintsUsed) rows.push([`Hints × ${hintsUsed}`, -SCORE.HINT * hintsUsed]);
    if (revealed) rows.push(['Declassified answer', -SCORE.REVEAL]);
    if (efficient && !revealed) rows.push(['Efficiency bonus', SCORE.EFFICIENCY]);
    let underPar = false;
    if (timeLimit && elapsed <= timeLimit) {
      underPar = true;
      rows.push(['Under par', SCORE.PAR_FIXED + Math.round(SCORE.PAR_SCALED * (1 - elapsed / timeLimit))]);
    }
    const raw = rows.reduce((s, r) => s + r[1], 0);
    const total = Math.max(SCORE.FLOOR, raw);
    if (total !== raw) rows.push(['Floor', total - raw]);
    return { total, rows, underPar };
  }
  const fmtTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

  /* ==== SMALL UI PIECES ==== */
  function Modal({ onClose, label, children }) {
    useEffect(() => {
      const k = (e) => { if (e.key === 'Escape') onClose(); };
      window.addEventListener('keydown', k);
      return () => window.removeEventListener('keydown', k);
    }, [onClose]);
    return (
      <div className="backdrop" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
        <div className="modal" role="dialog" aria-modal="true" aria-label={label}>
          <button className="btn ghost x" onClick={onClose} aria-label="Close">✕</button>
          {children}
        </div>
      </div>
    );
  }

  function Logo({ size = 34 }) {
    return (
      <svg width={size} height={size} viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="var(--accent)" />
        <path d="M20 14v36" stroke="var(--accent-ink)" strokeWidth="5" strokeLinecap="round" />
        <path d="M20 40c0-10 22-8 22-20" stroke="var(--accent-ink)" strokeWidth="5" fill="none" strokeLinecap="round" />
        <circle cx="20" cy="50" r="6" fill="var(--accent-ink)" />
        <circle cx="20" cy="14" r="6" fill="var(--accent-ink)" />
        <circle cx="42" cy="20" r="8" fill="var(--accent)" stroke="var(--accent-ink)" strokeWidth="4.5" />
        <path d="M48 26l6 6" stroke="var(--accent-ink)" strokeWidth="5" strokeLinecap="round" />
      </svg>
    );
  }

  function CoffeeButton({ compact }) {
    if (!SUPPORT_URL) return null;
    return (
      <a className="coffee-btn" href={SUPPORT_URL} target="_blank" rel="noopener noreferrer" aria-label="Buy Me a Coffee (opens in a new tab)">
        <span className="cup" aria-hidden="true">☕</span><span className={compact ? 'lbl-long' : ''}>Buy Me a Coffee</span>
      </a>
    );
  }
  function SupportCard({ title, text }) {
    if (!SUPPORT_URL) return null;
    return (
      <section className="card pad support" style={{ marginBottom: 16 }}>
        <div><b>{title}</b><p>{text}</p></div>
        <CoffeeButton />
      </section>
    );
  }

  /* ==== HEADER ==== */
  function Header({ progress, theme, setTheme, sound, setSound, onReset }) {
    const n = solvedCount(progress);
    return (
      <header className="top">
        <div className="wrap">
          <a className="logo" href="#" onClick={(e) => e.preventDefault()}>
            <Logo />
            <span>Who Broke Prod?<small>A Git forensics game</small></span>
          </a>
          <div className="progress" aria-live="polite">
            <span>Cases closed <b style={{ color: 'var(--ink)' }}>{n}/{CASES.length}</b></span>
            <span className="bar" aria-hidden="true"><i style={{ width: `${(n / CASES.length) * 100}%` }} /></span>
          </div>
          <div className="tools">
            <button className="btn" onClick={() => setSound(!sound)} aria-pressed={sound}>{sound ? '🔊 Sound' : '🔇 Muted'}</button>
            <button className="btn" onClick={() => setTheme(THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length])} title="Switch theme">{THEME_LABEL[theme]}</button>
            <a className="btn" href="cheatsheet.html" target="_blank" rel="noopener">📘 Cheat sheet</a>
            <CoffeeButton compact />
            <button className="btn danger" onClick={onReset}>Reset</button>
          </div>
        </div>
      </header>
    );
  }

  /* ==== CASE STRIP ==== */
  function CaseStrip({ progress, current, onPick }) {
    return (
      <nav className="strip" aria-label="Cases">
        {CASES.map((c, i) => {
          const open = isUnlocked(progress, i);
          return (
            <button key={c.id} className={`chip ${i === current ? 'active' : ''} ${progress.solved[c.id] ? 'done' : ''}`} disabled={!open} onClick={() => onPick(i)} aria-current={i === current ? 'step' : undefined} title={open ? c.title : 'Close the previous case to unlock'}>
              <b>{open ? '' : '🔒 '}{String(i + 1).padStart(2, '0')}</b>
              <span>{c.difficulty}</span>
            </button>
          );
        })}
      </nav>
    );
  }

  /* ==== LEFT PANEL — DOSSIER ==== */
  function Dossier({ c, index, session, onCheat, onHint, onReveal, st }) {
    const ref = useMemo(() => reference(c), [c]);
    const canReveal = session.failed >= 3;
    return (
      <section className="card pad" aria-labelledby="case-title">
        <div className="eyebrow">Case {String(index + 1).padStart(2, '0')} · {c.chapter}</div>
        <h1 className="case-title" id="case-title">{c.title}</h1>
        <div className="tags">
          <span className="tag accent">{c.difficulty}</span>
          <span className="tag">{c.grade.kind === 'output' ? 'Evidence: command output' : 'Evidence: repository state'}</span>
          {c.timeLimit ? <span className="tag">⏱ par {fmtTime(c.timeLimit)}</span> : null}
        </div>
        <p className="briefing">{c.briefing}</p>
        <div className="mentor"><b>{c.officer.name} <span>· {c.officer.role}</span></b>{c.officer.note}</div>
        <h3 className="sec">Objectives</h3>
        <ul className="obj">{c.objectives.map((o, i) => <li key={i}>{o}</li>)}</ul>
        <div className="evidence-line"><b>Graded on:</b> {c.evidence} {c.grade.kind === 'output' ? <>File it with <kbd>Ctrl</kbd>+<kbd>Enter</kbd> (your last command, or the one in the prompt).</> : <>Close the case with <kbd>Ctrl</kbd>+<kbd>Enter</kbd> when the case board is all green.</>}</div>
        <h3 className="sec">Field kit <span style={{ textTransform: 'none', letterSpacing: 0, fontWeight: 400 }}>(click to insert)</span></h3>
        <div className="cheats">
          {c.cheats.map(([tok, desc]) => (
            <button key={tok} className="cheat" onClick={() => onCheat(tok)}><code>{tok}</code><span>{desc}</span></button>
          ))}
        </div>
        <div className="intel">
          <div className="intel-row">
            <button className="btn" onClick={() => onHint(0)} disabled={session.hintsUsed >= 1}>💡 Hint 1 <span style={{ opacity: .7 }}>−{SCORE.HINT}</span></button>
            <button className="btn" onClick={() => onHint(1)} disabled={session.hintsUsed < 1 || session.hintsUsed >= 2}>💡 Hint 2 <span style={{ opacity: .7 }}>−{SCORE.HINT}</span></button>
            <button className="btn" onClick={onReveal} disabled={!canReveal || session.revealed} title={canReveal ? '' : 'Available after 3 misfires'}>🗂 Declassify <span style={{ opacity: .7 }}>−{SCORE.REVEAL}</span></button>
          </div>
          {!canReveal && !session.revealed ? <div style={{ fontSize: 12, color: 'var(--muted)', marginTop: 6 }}>Declassify unlocks after 3 misfires ({session.failed}/3).</div> : null}
          {session.hintsUsed >= 1 ? <div className="hint">💡 {c.hints[0]}</div> : null}
          {session.hintsUsed >= 2 ? <div className="hint">💡 {c.hints[1]}</div> : null}
          {session.revealed ? (
            <div className="declass">
              <b>Declassified reference</b>
              <pre className="mono">{ref.lines.join('\n')}</pre>
              {ref.note ? <div>{ref.note}</div> : null}
            </div>
          ) : null}
        </div>
      </section>
    );
  }

  /* ==== TERMINAL ==== */
  function renderOutLine(l, onHash) {
    let cls = '';
    if (/^commit [0-9a-f]{40}/.test(l)) {
      const m = l.match(/^commit ([0-9a-f]{40})(.*)$/);
      return <><span className="c-commit">commit </span><span className="c-hash" onClick={() => onHash(m[1].slice(0, 7))}>{m[1]}</span><span className="c-deco">{m[2]}</span></>;
    }
    if (/^[0-9a-f]{40} is the first bad commit/.test(l)) cls = 'c-culprit';
    else if (/^diff --git|^(\+\+\+|---) /.test(l)) cls = 'c-file';
    else if (/^@@/.test(l)) cls = 'c-hunk';
    else if (/^\+/.test(l) || /^\s+✔/.test(l)) cls = 'c-add';
    else if (/^-/.test(l) || /^\s+✖/.test(l)) cls = 'c-del';
    else if (/^(fatal|error|bash:|CONFLICT|npm ERR!|Error )/.test(l)) cls = 'c-err';
    else if (/^\[sandbox\]|^sandbox:|^hint:|^\(bisect-check/.test(l)) cls = 'c-note';
    else if (/^Bisecting:|^running |^bisect found/.test(l)) cls = 'c-bisect';
    if (cls) return <span className={cls}>{l}</span>;
    const m = l.match(/^(\* )?(\^?)([0-9a-f]{7,8})(\b.*)$/);
    if (m) {
      const rest = m[4];
      const d = rest.match(/^( \((?:HEAD|tag:|[\w./-]+(?:,|\)))[^)]*\))(.*)$/);
      return <>{m[1]}{m[2]}<span className="c-hash" onClick={() => onHash(m[3].slice(0, 7))}>{m[3]}</span>{d ? <><span className="c-deco">{d[1]}</span>{d[2]}</> : rest}</>;
    }
    const b = l.match(/^\[([0-9a-f]{40})\] (.*)$/);
    if (b) return <><span className="c-bisect">[</span><span className="c-hash" onClick={() => onHash(b[1].slice(0, 7))}>{b[1]}</span><span className="c-bisect">] </span>{b[2]}</>;
    return l;
  }

  function Terminal({ lines, prompt, input, setInput, onRun, onSubmit, onComplete, completions, history, timer, shake, submitLabel, inputRef, onHash, onResetSandbox }) {
    const bodyRef = useRef(null);
    const [hp, setHp] = useState(-1);
    useEffect(() => { const b = bodyRef.current; if (b) b.scrollTop = b.scrollHeight; }, [lines]);
    const key = (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); setHp(-1); onSubmit(); return; }
      if (e.key === 'Enter') { e.preventDefault(); setHp(-1); onRun(); return; }
      if (e.key === 'Tab') { e.preventDefault(); onComplete(); return; }
      if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); onRun('clear'); return; }
      if (e.key === 'ArrowUp') {
        if (!history.length) return;
        e.preventDefault();
        const n = hp < 0 ? history.length - 1 : Math.max(0, hp - 1);
        setHp(n); setInput(history[n]);
      }
      if (e.key === 'ArrowDown') {
        if (hp < 0) return;
        e.preventDefault();
        const n = hp + 1;
        if (n >= history.length) { setHp(-1); setInput(''); } else { setHp(n); setInput(history[n]); }
      }
    };
    const [user, branch] = prompt;
    return (
      <section className={`term ${shake ? 'shake' : ''}`} aria-label="Terminal">
        <div className="term-head">
          <span className="dots" aria-hidden="true"><i /><i /><i /></span>
          <span className="grow">oncall@kettlebird: ~/kettlebird-shop</span>
          {timer}
        </div>
        <div className="term-body" ref={bodyRef} onClick={(e) => { if (!window.getSelection().toString() && e.target === e.currentTarget) inputRef.current && inputRef.current.focus(); }}>
          {lines.map((l, i) => l.kind === 'cmd'
            ? <div key={i} className="tl cmd"><span className="ps">{l.user}<b> ({l.branch})</b> $ </span>{l.text}</div>
            : <div key={i} className={`tl ${l.kind === 'sys' ? 'c-sys' : ''}`}>{l.kind === 'sys' ? l.text : renderOutLine(l.text, onHash)}</div>)}
        </div>
        {completions.length ? <div className="completions">{completions.join('   ')}</div> : null}
        <div className="term-input">
          <label htmlFor="cmd">{user}<b> ({branch})</b> $</label>
          <input id="cmd" ref={inputRef} value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={key} autoComplete="off" autoCapitalize="off" autoCorrect="off" spellCheck="false" placeholder="type a command — try: git log --oneline" aria-describedby="term-keys" />
        </div>
        <div className="term-actions">
          <button className="btn" onClick={() => onRun()}>▶ Run</button>
          <button className="btn primary" onClick={onSubmit}>{submitLabel}</button>
          <button className="btn ghost" onClick={onResetSandbox} title="Rebuild the repository and clear your command history (penalties stay)">↺ Fresh repo</button>
          <span className="keys" id="term-keys"><kbd>Enter</kbd> run · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> file · <kbd>Tab</kbd> complete · <kbd>↑</kbd> history</span>
        </div>
      </section>
    );
  }

  /* ==== EVIDENCE / CASE BOARD ==== */
  function EvidencePanel({ c, st, last, checks, log }) {
    let body;
    if (c.grade.kind === 'output') {
      const kind = c.grade.expect;
      const want = c.grade.expected;
      const items = last && last.items && last.items.kind === (kind === 'blame' ? 'blame' : 'commits') ? last.items.list : null;
      if (!items) {
        body = <div className="ev-status neutral">{kind === 'blame' ? 'Run a git blame command to compare it against the evidence.' : 'Run a git log command to compare it against the evidence.'}</div>;
      } else {
        const d = diffItems(want, items);
        const noun = kind === 'blame' ? 'line' : 'commit';
        body = (
          <>
            <div className={`ev-status ${d.exact ? 'good' : 'neutral'}`}>
              {d.exact ? `✔ Airtight: exactly the evidence. File it (Ctrl+Enter).` : `${items.length} ${noun}${items.length === 1 ? '' : 's'} listed · ${d.hits}/${want.length} evidence found`}
            </div>
            {!d.exact ? (
              <ul>
                {d.extras.length ? <li><b style={{ color: 'var(--bad)' }}>{d.extras.length} not evidence:</b> <span className="mono">{d.extras.slice(0, 3).map((x) => itemLabel(st, kind, x)).join(' · ')}{d.extras.length > 3 ? ' …' : ''}</span></li> : null}
                {d.missing.length ? <li><b>{d.missing.length} still missing.</b></li> : null}
                {!d.extras.length && !d.missing.length ? <li>Right {noun}s, wrong order or count. Check your options.</li> : null}
              </ul>
            ) : null}
          </>
        );
      }
    } else {
      const allOk = checks.every((k) => k.ok);
      body = (
        <>
          <div className={`ev-status ${allOk ? 'good' : 'neutral'}`}>{allOk ? '✔ Every objective is met. Close the case (Ctrl+Enter).' : 'Case board'}</div>
          <ul>
            {checks.map((k, i) => (
              <li key={i} className={`check ${k.ok ? 'ok' : 'no'}`}>
                <span className="mark">{k.ok ? '✓' : '○'}</span>
                <span>{k.label}{k.note && !k.ok ? <div className="note">{k.note}</div> : null}</span>
              </li>
            ))}
          </ul>
        </>
      );
    }
    return (
      <section className="card ev" aria-live="polite" aria-label="Evidence">
        {body}
        {log.length ? <div className="log">{log.slice(-8).map((l, i) => <div key={i} className={l.kind}>{l.t} {l.text}</div>)}</div> : null}
      </section>
    );
  }

  /* ==== COMMIT GRAPH ==== */
  const RH = 28, LW = 16;
  function Graph({ st, version, listed, onPick }) {
    const v = useMemo(() => GitSim.view(st), [st, version]);
    const idx = {};
    v.rows.forEach((r, i) => { idx[r.id] = i; });
    const lanesW = Math.max(1, v.lanes) * LW + 10;
    const H = v.rows.length * RH;
    const x = (l) => 12 + l * LW, y = (i) => i * RH + RH / 2;
    const paths = [];
    v.rows.forEach((r, i) => {
      if (!r.parent || idx[r.parent] == null) return;
      const j = idx[r.parent], p = v.rows[j];
      const x1 = x(r.lane), y1 = y(i), x2 = x(p.lane), y2 = y(j);
      const d = x1 === x2 ? `M${x1},${y1} L${x2},${y2}` : `M${x1},${y1} L${x1},${y2 - RH * .6} Q${x1},${y2} ${x2 + (x1 > x2 ? 6 : -6)},${y2}`;
      paths.push(<path key={r.id} d={d} stroke={`var(--lane-${r.lane % 6})`} strokeWidth="2" fill="none" />);
    });
    const listedSet = new Set(listed || []);
    return (
      <section className="card" aria-label="Commit graph">
        <div className="graph-head">
          <h3>Commit graph</h3>
          <span style={{ fontSize: 12, color: 'var(--muted)' }}>{v.rows.length} reachable commits · click a row to insert its hash</span>
          {v.bisecting ? (
            <span className="legend"><span><i style={{ background: 'var(--good)' }} />good</span><span><i style={{ background: 'var(--bad)' }} />bad</span><span><i style={{ background: 'var(--muted)' }} />skip</span><span>faded = cleared</span></span>
          ) : null}
        </div>
        <div className="graph">
          <div style={{ position: 'relative', minHeight: H }}>
            <svg width={lanesW} height={H} aria-hidden="true">
              {paths}
              {v.rows.map((r, i) => {
                const fill = r.mark === 'good' ? 'var(--good)' : r.mark === 'bad' || r.mark === 'culprit' ? 'var(--bad)' : r.mark === 'skip' ? 'var(--muted)' : 'var(--panel)';
                return (
                  <g key={r.id}>
                    {r.head ? <circle cx={x(r.lane)} cy={y(i)} r="8.5" fill="none" stroke="var(--accent)" strokeWidth="2" /> : null}
                    <circle cx={x(r.lane)} cy={y(i)} r="5" fill={fill} stroke={`var(--lane-${r.lane % 6})`} strokeWidth="2.2" />
                  </g>
                );
              })}
            </svg>
            {v.rows.map((r) => (
              <div key={r.id} className={`grow-row ${listedSet.has(r.id) ? 'listed' : ''} ${r.mark === 'out' ? 'out' : ''}`} style={{ paddingLeft: lanesW }} onClick={() => onPick(r.short)} title={`${r.hash}\n${r.author} · ${r.date}`}>
                <span className="h">{r.short}</span>
                {r.refs.map((f) => <span key={f} className={`ref ${f.startsWith('HEAD') ? 'head' : ''} ${f.startsWith('tag:') ? 'tag' : ''}`}>{f}</span>)}
                {r.mark && r.mark !== 'out' ? <span className={`mk ${r.mark}`}>{r.mark === 'culprit' ? 'first bad' : r.mark}</span> : null}
                {r.picked ? <span className="mk pick">picked</span> : null}
                <span className="s">{r.subject}</span>
                <span className="a">{r.author} · {r.date.slice(5)}</span>
              </div>
            ))}
          </div>
        </div>
      </section>
    );
  }

  /* ==== BADGES ==== */
  function Badges({ progress }) {
    return (
      <section className="card pad" aria-label="Commendations">

  function downloadEmblem(svgEl) {

  function CompletionModal({ progress, onClose }) {
    const total = CASES.reduce((s, c) => s + (progress.solved[c.id] ? progress.solved[c.id].score : 0), 0);
    const date = progress.completedAt ? new Date(progress.completedAt).toISOString().slice(0, 10) : '';
    const ref = useRef(null);
    return (
      <Modal onClose={onClose} label="Principal Investigator badge">
        <div className="pad" style={{ textAlign: 'center' }}>
          <div className="eyebrow">All ten cases closed</div>

          <div ref={ref} style={{ display: 'inline-block' }}><Emblem score={total} date={date} /></div>
          <p style={{ color: 'var(--muted)', maxWidth: 480, margin: '10px auto' }}>log for what changed, blame for who, bisect for when, reflog for what went missing, cherry-pick to ship only the fix. That’s an incident toolkit.</p>
          <div style={{ display: 'flex', gap: 8, justifyContent: 'center', flexWrap: 'wrap' }}>
            <button className="btn primary" onClick={() => downloadEmblem(ref.current.querySelector('svg'))}>⬇ Download badge (PNG)</button>
            <CoffeeButton />
          </div>

  /* ==== VICTORY MODAL ==== */
  function VictoryModal({ c, result, onClose, onNext, isLast, onFinal }) {
    const ref = reference(c);
    return (
      <Modal onClose={onClose} label="Case closed">
        <div className="pad">
          <div className="stamp">CASE CLOSED</div>
          <h2 style={{ margin: '12px 0 2px' }}>{c.title}</h2>
          <div style={{ color: 'var(--muted)', fontSize: 13 }}>{c.chapter}</div>
          <div className="tiles">
            <div className="tile"><b>{result.score.total}</b><span>Score</span></div>
            <div className="tile"><b>{fmtTime(result.elapsed)}</b><span>Time</span></div>
            <div className="tile"><b>{result.session.failed}</b><span>Misfires</span></div>
            <div className="tile"><b>{result.session.hintsUsed}{result.session.revealed ? '+🗂' : ''}</b><span>Hints</span></div>
          </div>
          <table className="breakdown"><tbody>{result.score.rows.map(([k, v]) => <tr key={k}><td>{k}</td><td>{v > 0 && k !== 'Base' ? '+' : ''}{v}</td></tr>)}</tbody></table>
          {!result.efficient && !result.session.revealed ? <div style={{ fontSize: 12, color: 'var(--muted)', marginTop: 6 }}>Efficiency bonus: {c.grade.kind === 'output' ? `the reference uses ${ref.size} words; yours used ${result.size}.` : c.grade.size === 'steps' ? `the reference bisect tested ${ref.size} commits; yours tested ${result.size}.` : `the reference needs ${ref.size} branch-moving command${ref.size === 1 ? '' : 's'}; you used ${result.size}.`}</div> : null}
          <h3 className="sec">{c.grade.kind === 'output' ? 'Your command, explained' : 'Your moves'}</h3>
          {c.grade.kind === 'output' ? (
            <ul className="explain">{GitSim.explain(result.cmd).map((r, i) => <li key={i}><code>{r.tok}</code><span>{r.desc}</span></li>)}</ul>
          ) : (
            <ul className="explain">{result.moves.map((m, i) => { const e = GitSim.explain(m); return <li key={i}><code>{m}</code><span>{(e[1] && e[0].tok === 'git bisect' ? e[1].desc : e[0] ? e[0].desc : '')}</span></li>; })}</ul>
          )}
          <h3 className="sec">Reference</h3>
          <pre className="mono" style={{ margin: 0, whiteSpace: 'pre-wrap', wordBreak: 'break-all', fontSize: 13 }}>{ref.lines.join('\n')}</pre>
          {ref.note ? <div style={{ fontSize: 13, color: 'var(--muted)', marginTop: 4 }}>{ref.note}</div> : null}
          <h3 className="sec">Concept unlocked</h3>
          <p style={{ margin: 0, fontSize: 14 }}>{c.conceptUnlocked}</p>
          <h3 className="sec">Debrief</h3>
          <div className="debrief">{c.debrief}</div>
          <div style={{ display: 'flex', gap: 8, marginTop: 16, justifyContent: 'flex-end', flexWrap: 'wrap' }}>
            <button className="btn" onClick={onClose}>Stay here</button>
            {isLast ? <button className="btn primary" onClick={onFinal}>🏅 Claim your badge</button> : <button className="btn primary" onClick={onNext}>Next case →</button>}
          </div>
        </div>
      </Modal>
    );
  }

  /* ==== APP ==== */
  function useNow(active) {
    const [, setT] = useState(0);
    useEffect(() => { if (!active) return; const id = setInterval(() => setT((t) => t + 1), 1000); return () => clearInterval(id); }, [active]);
  }

  function App() {
    const [progress, setProgress] = useState(loadProgress);
    const [current, setCurrent] = useState(progress.current);
    const c = CASES[current];
    const stRef = useRef(null);
    const [version, setVersion] = useState(0);
    const [lines, setLines] = useState([]);
    const [last, setLast] = useState(null);
    const [lastEvidenceCmd, setLastEvidenceCmd] = useState('');
    const [input, setInputRaw] = useState('');
    const [completions, setCompletions] = useState([]);
    const [log, setLog] = useState([]);
    const [shake, setShake] = useState(false);
    const [victory, setVictory] = useState(null);
    const [showFinal, setShowFinal] = useState(false);
    const inputRef = useRef(null);
    const sound = progress.settings.sound;
    const systemDark = typeof matchMedia !== 'undefined' && matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = progress.settings.theme || (systemDark ? 'night' : 'day');

    useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
    useEffect(() => { saveProgress(progress); }, [progress]);

    const update = useCallback((fn) => setProgress((p) => { const n = fn(JSON.parse(JSON.stringify(p))); return n; }), []);
    const session = progress.sessions[c.id] || { failed: 0, hintsUsed: 0, revealed: false, start: Date.now() };
    const draft = progress.drafts[c.id] || { history: [], input: null };

    // Load / rebuild the sandbox when the case changes.
    useEffect(() => {
      const d = (progress.drafts[c.id] || { history: [] });
      const st = GitSim.build(c.repo);
      const out = [{ kind: 'sys', text: `# Case ${String(current + 1).padStart(2, '0')} · ${c.title} · forensic copy of kettlebird-shop loaded. Type "help" for commands.` }];
      let lastR = null, lastEv = '';
      for (const line of d.history) {
        const [user, branch] = ['oncall@kettlebird', GitSim.promptLabel(st)];
        const r = GitSim.exec(st, line);
        if (r.clear) out.length = 0;
        else out.push({ kind: 'cmd', text: line, user, branch });
        if (r.out) for (const l of r.out.split('\n')) out.push({ kind: 'out', text: l });
        lastR = r;
        if (r.items) lastEv = line;
      }
      if (d.history.length) out.push({ kind: 'sys', text: `# (${d.history.length} command${d.history.length === 1 ? '' : 's'} replayed from your last visit)` });
      stRef.current = st;
      setLines(out.slice(-MAX_LINES));
      setLast(lastR);
      setLastEvidenceCmd(lastEv);
      setInputRaw(d.input != null ? d.input : d.history.length ? '' : c.startInput || '');
      setCompletions([]);
      setLog([]);
      setVersion((v) => v + 1);
      update((p) => {
        if (!p.sessions[c.id]) p.sessions[c.id] = { failed: 0, hintsUsed: 0, revealed: false, start: Date.now() };
        p.current = current;
        return p;
      });
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [current]);

    const setInput = (v) => {
      setInputRaw(v);
      setCompletions([]);
      update((p) => { p.drafts[c.id] = { ...(p.drafts[c.id] || { history: [] }), input: v }; return p; });
    };
    const addLog = (text, kind) => setLog((l) => [...l.slice(-30), { t: new Date().toTimeString().slice(0, 8), text, kind: kind || '' }]);

    const st = stRef.current;
    const elapsed = Math.max(0, (Date.now() - session.start) / 1000);
    useNow(!!c.timeLimit && !progress.solved[c.id]);

    function runLine(line) {
      const s = stRef.current;
      const text = (line != null ? line : input).trim();
      if (!text) return null;
      const branch = GitSim.promptLabel(s);
      const r = GitSim.exec(s, text);
      setLines((ls) => {
        const base = r.clear ? [] : [...ls, { kind: 'cmd', text, user: 'oncall@kettlebird', branch }];
        const outs = r.out ? r.out.split('\n').map((l) => ({ kind: 'out', text: l })) : [];
        return [...base, ...outs].slice(-MAX_LINES);
      });
      setLast(r);
      if (r.items) setLastEvidenceCmd(text);
      setVersion((v) => v + 1);
      setInputRaw('');
      setCompletions([]);
      update((p) => {
        const d = p.drafts[c.id] || { history: [] };
        p.drafts[c.id] = { history: [...d.history, text].slice(-MAX_HISTORY), input: '' };
        return p;
      });
      beep(r.error ? 'error' : 'run', sound);
      return { r, text };
    }

    function misfire(msgs) {
      update((p) => { const s = p.sessions[c.id] || { ...session }; s.failed = (s.failed || 0) + 1; p.sessions[c.id] = s; return p; });
      setShake(true); setTimeout(() => setShake(false), 450);
      beep('fail', sound);
      addLog(`✖ Misfire (−${SCORE.MISFIRE}).`, 'bad');
      for (const m of msgs) addLog('  ' + m, 'bad');
      if (session.failed + 1 >= 3 && !session.revealed) addLog('  Declassify is now available in the dossier.', '');
    }

    function win(extra) {
      const s = stRef.current;
      const ref = reference(c);
      let size, efficient;
      if (c.grade.kind === 'output') { size = GitSim.tokenCount(extra.cmd); }
      else size = stateSize(c, s);
      efficient = size <= ref.size;
      const el = Math.round((Date.now() - session.start) / 1000);
      const score = computeScore(session, efficient, el, c.timeLimit);
      const moves = c.grade.kind === 'state' ? (progress.drafts[c.id] || { history: [] }).history.filter((h) => GitSim.isMutatingCmd(h)) : [];
      const result = { score, elapsed: el, session: { ...session }, efficient, size, cmd: extra.cmd, moves };
      update((p) => {
        const prev = p.solved[c.id];
        p.solved[c.id] = {
          score: Math.max(score.total, prev ? prev.score : 0), lastScore: score.total, input: extra.cmd || moves.join(' ; '),
          time: el, failed: session.failed, hintsUsed: session.hintsUsed, revealed: !!session.revealed, efficient: efficient && !session.revealed,
          underPar: score.underPar || !!(prev && prev.underPar), solvedAt: Date.now(),
        };
        if (CASES.every((k) => p.solved[k.id]) && !p.completedAt) p.completedAt = Date.now();
        p.sessions[c.id] = { failed: 0, hintsUsed: 0, revealed: false, start: Date.now() };
        return p;
      });
      beep('win', sound);
      addLog(`✔ Case closed: ${score.total} points.`, 'good');
      setVictory(result);
    }

    function submit() {
      const s = stRef.current;
      if (c.grade.kind === 'output') {
        let cmd = input.trim() ? input.trim() : lastEvidenceCmd;
        let r = null;
        if (input.trim()) { const ran = runLine(input); r = ran && ran.r; }
        else if (lastEvidenceCmd) { r = GitSim.exec(s, lastEvidenceCmd); setVersion((v) => v + 1); }
        const kind = c.grade.expect === 'blame' ? 'blame' : 'commits';
        if (!cmd) { addLog(`Nothing to file yet. Run a git ${c.grade.expect === 'blame' ? 'blame' : 'log'} command first.`); beep('error', sound); return; }
        if (!r || !r.items || r.items.kind !== kind) {
          addLog(`“${cmd}” isn’t evidence. File a single git ${c.grade.expect === 'blame' ? 'blame' : 'log'} command (no && or ;). No penalty.`);
          beep('error', sound);
          return;
        }
        const d = diffItems(c.grade.expected, r.items.list);
        if (d.exact) { win({ cmd }); return; }
        const msgs = [];
        if (d.extras.length) msgs.push(`${d.extras.length} item${d.extras.length === 1 ? '' : 's'} that aren’t evidence (e.g. ${itemLabel(s, kind, d.extras[0])}).`);
        if (d.missing.length) msgs.push(`${d.missing.length} piece${d.missing.length === 1 ? '' : 's'} of evidence missing.`);
        if (!d.extras.length && !d.missing.length) msgs.push('Right items, wrong order or count.');
        if (!s.HEAD.ref && kind === 'commits') msgs.push('HEAD is detached, so git log starts from there. Name main explicitly or switch back.');
        for (const [re, m] of c.nudges || []) if (re.test(cmd)) msgs.push(m);
        misfire(msgs);
      } else {
        if (input.trim()) runLine(input);
        const checks = c.grade.check(GitSim.api(stRef.current));
        if (checks.every((k) => k.ok)) { win({ cmd: '' }); return; }
        misfire(checks.filter((k) => !k.ok).map((k) => `Not yet: ${k.label}.${k.note ? ' ' + k.note : ''}`));
      }
    }

    function complete() {
      const r = GitSim.complete(stRef.current, input);
      setInputRaw(r.line);
      setCompletions(r.options.slice(0, 24));
    }
    function insert(tok) {
      const el = inputRef.current;
      const v = input;
      let pos = el && document.activeElement === el ? el.selectionStart : v.length;
      const needsSpace = pos > 0 && !/\s$/.test(v.slice(0, pos)) && !/^[-=]/.test(tok) ? ' ' : (pos > 0 && !/\s$/.test(v.slice(0, pos)) ? ' ' : '');
      const nv = v.slice(0, pos) + needsSpace + tok + v.slice(pos);
      setInput(nv);
      setTimeout(() => { if (el) { el.focus(); const p = pos + needsSpace.length + tok.length; el.setSelectionRange(p, p); } }, 0);
    }
    function hint(n) {
      if (session.hintsUsed > n) return;
      update((p) => { const s = p.sessions[c.id] || { ...session }; s.hintsUsed = n + 1; p.sessions[c.id] = s; return p; });
      addLog(`💡 Hint ${n + 1} revealed (−${SCORE.HINT}).`);
      beep('ok', sound);
    }
    function reveal() {
      if (session.failed < 3) return;
      update((p) => { const s = p.sessions[c.id] || { ...session }; s.revealed = true; p.sessions[c.id] = s; return p; });
      addLog(`🗂 Reference declassified (−${SCORE.REVEAL}, no efficiency bonus).`);
    }
    function resetSandbox() {
      update((p) => { p.drafts[c.id] = { history: [], input: c.startInput || '' }; return p; });
      const st2 = GitSim.build(c.repo);
      stRef.current = st2;
      setLines([{ kind: 'sys', text: `# Fresh copy of the repository. Penalties and the clock carry on.` }]);
      setLast(null); setLastEvidenceCmd(''); setInputRaw(c.startInput || ''); setVersion((v) => v + 1);
    }
    function resetAll() {
      if (!confirm('Reset all progress? Solved cases, scores and drafts will be erased (theme and sound settings stay).')) return;
      const settings = progress.settings;
      const fresh = { ...DEFAULTS(), settings };
      saveProgress(fresh);
      setProgress(fresh);
      if (current === 0) location.reload(); else setCurrent(0);
    }

    useEffect(() => {
      const k = (e) => { if (e.key === '/' && document.activeElement && document.activeElement.tagName !== 'INPUT' && !victory) { e.preventDefault(); inputRef.current && inputRef.current.focus(); } };
      window.addEventListener('keydown', k);
      return () => window.removeEventListener('keydown', k);
    }, [victory]);

    if (!st) return null;
    const checks = c.grade.kind === 'state' ? c.grade.check(GitSim.api(st)) : [];
    const listed = last && last.items ? (last.items.kind === 'blame' ? last.items.list.map((x) => x.split(':')[1]) : last.items.list) : [];
    const timer = c.timeLimit && !progress.solved[c.id]
      ? <span className={`timer ${elapsed > c.timeLimit ? 'over' : ''}`} aria-label="Par timer">⏱ {fmtTime(elapsed)} / {fmtTime(c.timeLimit)}</span>
      : null;
    const solved = solvedCount(progress);
    const milestone = SUPPORT_URL && [3, 6, 9].includes(solved);

    return (
      <>
        <Header progress={progress} theme={theme} setTheme={(t) => update((p) => { p.settings.theme = t; return p; })} sound={sound} setSound={(v) => update((p) => { p.settings.sound = v; return p; })} onReset={resetAll} />
        <div className="wrap">
          <CaseStrip progress={progress} current={current} onPick={(i) => setCurrent(i)} />
          <main className="grid">
            <div>
              <Dossier c={c} index={current} session={session} st={st} onCheat={insert} onHint={hint} onReveal={reveal} />
              {progress.solved[c.id] ? (
                <section className="card pad" style={{ marginTop: 16 }}>
                  <b>✔ Closed</b> · best score {progress.solved[c.id].score}. Replay it freely; your best score is kept.
                  {current < CASES.length - 1 ? <div style={{ marginTop: 8 }}><button className="btn primary" onClick={() => setCurrent(current + 1)}>Next case →</button></div> : null}
                </section>
              ) : null}
            </div>
            <div>
              <Terminal lines={lines} prompt={['oncall@kettlebird', GitSim.promptLabel(st)]} input={input} setInput={setInput} onRun={(l) => runLine(l)} onSubmit={submit} onComplete={complete}
                completions={completions} history={draft.history} timer={timer} shake={shake} inputRef={inputRef} onHash={insert} onResetSandbox={resetSandbox}
                submitLabel={c.grade.kind === 'output' ? '⚖ File evidence' : '⚖ Close case'} />
              <div style={{ height: 16 }} />
              <EvidencePanel c={c} st={st} last={last} checks={checks} log={log} />
              <div style={{ height: 16 }} />
              <Graph st={st} version={version} listed={listed} onPick={insert} />
            </div>
          </main>
          {solved === CASES.length ? (
            <section className="card pad final-card" style={{ marginBottom: 16 }}>
              <Emblem size={96} score={CASES.reduce((s, k) => s + progress.solved[k.id].score, 0)} date="" />
              <div style={{ flex: 1 }}><b>Principal Investigator</b><div style={{ color: 'var(--muted)', fontSize: 14 }}>All ten cases closed. Your badge is ready.</div></div>
              <button className="btn primary" onClick={() => setShowFinal(true)}>View badge</button>
            </section>
          ) : null}
          {milestone ? (
            <SupportCard title={`${solved} cases closed. Nice work, detective.`} text="Who Broke Prod? is free, ad-free and runs entirely in your browser. If it made git bisect click, you can buy the on-call engineer a coffee." />
          ) : null}
          <Badges progress={progress} />
        </div>
        <footer>
          <div className="wrap">
            <span>Blameless postmortems. Ruthless evidence.</span>
            <span>No accounts, no tracking. Progress stays in your browser.</span>
            <a href="cheatsheet.html" target="_blank" rel="noopener">Git forensics cheat sheet</a>
            <CoffeeButton />
            <span>All people, commits and companies are fictional. The Git here is a sandboxed simulation.</span>
          </div>
        </footer>
        {victory ? (
          <VictoryModal c={c} result={victory} isLast={current === CASES.length - 1 || solved === CASES.length}
            onClose={() => setVictory(null)}
            onNext={() => { setVictory(null); setCurrent(Math.min(CASES.length - 1, current + 1)); }}
            onFinal={() => { setVictory(null); setShowFinal(true); }} />
        ) : null}
        {showFinal ? <CompletionModal progress={progress} onClose={() => setShowFinal(false)} /> : null}
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
